name: CFC Top Instrutor 1.3.9 Calendario e PDF
on:
  push:
    branches: [cfctop-calendar-20261031]
    paths: [artifacts/CFCTop-Instrutor-1.3.9-source.base64]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: ''}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Conferir fontes
        run: |
          base64 -d artifacts/CFCTop-Instrutor-1.3.9-source.base64 > source.zip
          echo '1881a5ba8a59994312c92feec19ccbbfafe689cd01a857a39548826b2a6af969  source.zip' | sha256sum -c -
          unzip -q source.zip
          test -f CFC-Top-Instrutor-1.3.9/app/src/main/assets/app.js
          grep -q 'print-week-grid' CFC-Top-Instrutor-1.3.9/app/src/main/assets/app.js
      - name: Compilar APK
        working-directory: CFC-Top-Instrutor-1.3.9
        run: gradle --no-daemon assembleDebug
      - name: Validar APK
        run: |
          APK=$(find CFC-Top-Instrutor-1.3.9/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: CFC-Top-Instrutor-1.3.9-APK-CALENDARIO
          path: CFC-Top-Instrutor-1.3.9/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
