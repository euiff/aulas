name: CFC Top Instrutor 1.3.8 - Pendentes do instrutor
on:
  push:
    branches: [cfctop-pending-20261023]
    paths:
      - 'artifacts/CFCTop-Instrutor-1.3.8-source.base64'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Recuperar fonte e conferir SHA256
        run: |
          base64 -d artifacts/CFCTop-Instrutor-1.3.8-source.base64 > source.zip
          echo "23a520b188244900616ab9896ab265baa936cfe9ec29f58fc5c6c61c518fcd47  source.zip" | sha256sum -c -
          unzip -q source.zip
          test -s CFC-Top-Instrutor-1.3.8/app/src/main/assets/app.js
          grep -q 'Solicitações pendentes' CFC-Top-Instrutor-1.3.8/app/src/main/assets/app.js
      - name: Compilar APK Android
        working-directory: CFC-Top-Instrutor-1.3.8
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verificar assinatura, manifesto e pacote
        run: |
          APK=$(find CFC-Top-Instrutor-1.3.8/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
      - name: Exportar APK instalavel
        uses: actions/upload-artifact@v4
        with:
          name: CFC-Top-Instrutor-1.3.8-APK-INSTALAVEL
          path: CFC-Top-Instrutor-1.3.8/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
